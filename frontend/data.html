<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Export — PEARL</title>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script defer src="script.js"></script>
  <link rel="icon" href="Venus.ico">
  <style>
    /* WINDOWS 7 / NATIVE DESKTOP THEME */
    :root {
      --win-bg: #d4d0c8;
      --win-border: #8e8f8f;
      --win-panel: #ffffff;
      --win-title-bg: linear-gradient(180deg, #e4effb 0%, #c4ddfc 100%);
      --win-btn-bg: linear-gradient(180deg, #f2f2f2 0%, #e0e0e0 50%, #d4d4d4 50%, #e6e6e6 100%);
      --win-btn-border: #707070;
      --win-btn-hover: linear-gradient(180deg, #eaf6fd 0%, #d9f0fc 50%, #bee6fd 50%, #a7d9f5 100%);
      --win-btn-hover-border: #3c7fb1;
      --win-text: #000000;
      --win-highlight: #003399;
    }

    body {
      background: #f0f0f0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      font-size: 12px;
      color: var(--win-text);
      margin: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Navigation Sidebar */
    .app-sidebar {
      width: 220px;
      flex-shrink: 0;
      background: #ffffff;
      border-right: 1px solid var(--win-border);
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.05);
      z-index: 10;
    }

    .sidebar-header {
      padding: 15px 15px 25px 15px;
      background: linear-gradient(180deg, #f9fbfd 0%, #d1e4f9 100%);
      border-bottom: 1px solid #99b4d1;
    }

    .sidebar-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--win-highlight);
      text-shadow: 1px 1px 0px #fff;
    }

    .sidebar-nav {
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      color: #333;
      text-decoration: none;
      border: 1px solid transparent;
      border-radius: 3px;
      font-size: 13px;
    }

    .nav-item:hover {
      background: #e5f3fb;
      border-color: #70c0e7;
    }

    .nav-item.active {
      background: #cce8ff;
      border-color: #99d1ff;
      color: #000;
    }

    /* Main Area */
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f5f6f7;
    }

    .toolbar {
      height: 44px;
      background: linear-gradient(180deg, #f5f9ff 0%, #e0ebf8 100%);
      border-bottom: 1px solid #aebfd0;
      display: flex;
      align-items: center;
      padding: 0 15px;
      gap: 15px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .toolbar-divider {
      width: 1px;
      height: 24px;
      background: #aebfd0;
      border-right: 1px solid #fff;
    }

    .content-area {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Panel */
    .win-panel {
      background: #fff;
      border: 1px solid #999;
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .win-panel-title {
      background: linear-gradient(90deg, #d9e4f1 0%, #ffffff 100%);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--win-highlight);
      border-bottom: 1px solid #eee;
    }

    .win-panel-body {
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Buttons / Inputs */
    .win-btn {
      background: var(--win-btn-bg);
      border: 1px solid var(--win-btn-border);
      padding: 5px 15px;
      border-radius: 3px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 1px 1px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      color: #000;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .win-btn:hover:not(:disabled) {
      background: var(--win-btn-hover);
      border-color: var(--win-btn-hover-border);
    }

    .win-btn:disabled {
      color: #999;
      cursor: not-allowed;
    }

    .win-btn.primary {
      border-color: #3c7fb1;
      font-weight: bold;
    }

    .win-input {
      padding: 4px 6px;
      border: 1px solid #a0a0a0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-size: 12px;
    }

    .win-input:focus {
      border-color: #3c7fb1;
      outline: none;
    }

    /* Table */
    .win-table-container {
      border: 1px solid #a0a0a0;
      background: #fff;
      flex: 1;
      overflow-y: scroll;
      overflow-x: auto;
    }

    .win-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 1200px;
    }

    .win-table th {
      background: linear-gradient(180deg, #fcfcfc 0%, #e8e8e8 100%);
      border-bottom: 1px solid #a0a0a0;
      border-right: 1px solid #d0d0d0;
      padding: 6px 10px;
      text-align: left;
      font-weight: normal;
      position: sticky;
      top: 0;
      box-shadow: inset 1px 1px 0 #fff;
      z-index: 2;
      white-space: nowrap;
    }

    .win-table td {
      border-bottom: 1px solid #ebebeb;
      border-right: 1px solid #ebebeb;
      padding: 6px 10px;
      vertical-align: middle;
    }

    .win-table tr:hover {
      background: #e5f3fb;
    }

    .loading-state {
      text-align: center;
      padding: 40px;
      color: #666;
      font-size: 12px;
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 2px 6px;
      background: #e0e0e0;
      border: 1px solid #ccc;
      border-radius: 2px;
      font-size: 11px;
    }

    .badge-good {
      background: #dff0d8;
      border-color: #d6e9c6;
      color: #3c763d;
    }

    .badge-bad {
      background: #f2dede;
      border-color: #ebccd1;
      color: #a94442;
    }

    .badge-warn {
      background: #fcf8e3;
      border-color: #faebcc;
      color: #8a6d3b;
    }

    .badge-level {
      background: #e8f4f8;
      border-color: #bce8f1;
      color: #31708f;
      font-weight: bold;
    }

    .condition-pill {
      color: #333;
      font-weight: 600;
      font-size: 11px;
    }
  </style>
</head>

<body data-page="data">

  <aside class="app-sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">PEARL Medical System</div>
      <div style="font-size: 11px; color: #666; margin-top: 2px;">Database Version 4.2.1</div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
        </svg>
        Patient Directory
      </a>
      <a href="data.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
        </svg>
        Dataset Export
      </a>
      <a href="manage_patients.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
        Patient Management
      </a>
    </nav>
  </aside>

  <main class="app-main">
    <div class="toolbar">
      <input type="text" id="searchInput" class="win-input" placeholder="Search Patient ID..." style="width: 200px;" />
      <select id="conditionFilter" class="win-input">
        <option value="all">All Conditions</option>
        <option value="Post-Stroke">Post-Stroke</option>
        <option value="Parkinson's">Parkinson's</option>
        <option value="Traumatic Brain Injury">Traumatic Brain Injury</option>
        <option value="Cerebral Palsy">Cerebral Palsy</option>
        <option value="Multiple Sclerosis">Multiple Sclerosis</option>
        <option value="Other">Other</option>
      </select>
      <select id="levelFilter" class="win-input">
        <option value="all">All Levels</option>
        <option value="0">Level 0</option>
        <option value="1">Level 1</option>
        <option value="2">Level 2</option>
        <option value="3">Level 3</option>
        <option value="4">Level 4</option>
        <option value="5">Level 5</option>
      </select>
      <div class="toolbar-divider"></div>
      <button id="exportCsvBtn" class="win-btn primary" disabled>Export to CSV</button>
    </div>

    <div class="content-area">
      <div class="win-panel">
        <div class="win-panel-title">Clinical Dataset Viewer</div>
        <div class="win-panel-body">
          <div class="win-table-container">
            <div id="loadingState" class="loading-state">Querying database securely...</div>
            <table class="win-table" id="dataTable" style="display: none;">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Patient ID</th>
                  <th>Condition</th>
                  <th>Level Played</th>
                  <th>Session #</th>
                  <th>Duration (s)</th>
                  <th>Total Targets</th>
                  <th>Misses</th>
                  <th>Accuracy</th>
                  <th>Trend</th>
                  <th>Avg RT (s)</th>
                  <th>Best RT (s)</th>
                  <th>RT Var (s)</th>
                  <th>Fatigue Idx</th>
                </tr>
              </thead>
              <tbody id="dataTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>

</html>
